global:
  # Gmail SMTP settings
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'your gmailm'
  smtp_auth_username: 'yourmail'
  smtp_auth_password: 'your password'
  smtp_require_tls: true
  
  # Slack webhook (MUST be valid!)
  slack_api_url: ${SLACK_WEBHOOK_URL}
  # Telegram API
  telegram_api_url: 'https://api.telegram.org'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'all-channels'
  routes:
    - match:
        severity: critical
      receiver: 'all-channels'
      continue: true

receivers:
  - name: 'all-channels'
    email_configs:
      # Gmail (real email)
      - to: 'send email@gmail.com'
        send_resolved: true
        headers:
          Subject: '[PROMETHEUS] {{ .GroupLabels.alertname }} {{ .Status }}'
        html: |
          <h2>{{ .GroupLabels.alertname }} - {{ .Status }}</h2>
          {{ range .Alerts }}
          <p><b>Summary:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          <p><b>Instance:</b> {{ .Labels.instance }}</p>
          <p><b>Severity:</b> {{ .Labels.severity }}</p>
          <p><b>Started:</b> {{ .StartsAt }}</p>
          {{ end }}
      
      # Mailpit (local capture)
      - to: 'alerts@localhost'
        send_resolved: true
        smarthost: 'mailpit:1025'
        require_tls: false
        from: 'prometheus@localhost'
        headers:
          Subject: '[MAILPIT] {{ .GroupLabels.alertname }} {{ .Status }}'
        text: |
          {{ .GroupLabels.alertname }} - {{ .Status }}
          {{ range .Alerts }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          Started: {{ .StartsAt }}
          {{ end }}
    
    slack_configs:
      - channel: '#prom_alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }} - {{ .Status }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          *Severity:* {{ .Labels.severity }}
          *Status:* {{ .Status }}
          *Started:* {{ .StartsAt }}
          {{ end }}
    
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token: 'edit your bot token'
        chat_id: #integer id of ur telegram #
        send_resolved: true
        message: |
          {{ .GroupLabels.alertname }} - {{ .Status }}
          {{ range .Alerts }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          Started: {{ .StartsAt }}
          {{ end }}
